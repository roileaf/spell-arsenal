name: Spell Arsenal Release Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish to Foundry (for example v1.2.2)'
        required: true
        type: string
      dry_run:
        description: 'Ask Foundry to validate only, without publishing'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - name: Check JavaScript syntax
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find scripts tests -type f \( -name '*.js' -o -name '*.mjs' \) -print0)
      - name: Run tests
        run: npm test

  build:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate module manifest
        run: |
          jq -e '.id == "spell-arsenal" and (.version | type == "string")' module.json
          test "$(jq -r .version module.json)" = "$(jq -r .version package.json)"
          jq -r '.esmodules[], .styles[]' module.json | while IFS= read -r file; do test -f "$file"; done
      - name: Prepare release manifest
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REPOSITORY: ${{ github.repository }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          version="${RELEASE_TAG#v}"
          test "$version" = "$(jq -r .version module.json)"
          manifest="https://github.com/$REPOSITORY/releases/latest/download/module.json"
          if [ "$PRERELEASE" = "true" ]; then manifest="https://github.com/$REPOSITORY/releases/download/$RELEASE_TAG/module.json"; fi
          jq --arg version "$version" \
            --arg url "https://github.com/$REPOSITORY" \
            --arg manifest "$manifest" \
            --arg download "https://github.com/$REPOSITORY/releases/download/$RELEASE_TAG/module.zip" \
            '.version = $version | .url = $url | .manifest = $manifest | .download = $download' \
            module.json > release-manifest.json
          mv release-manifest.json module.json
      - name: Create module archive
        if: github.event_name == 'release'
        run: zip --recurse-paths module.zip module.json README.md CHANGELOG.md LICENSE scripts/ styles/
      - name: Upload release files
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" module.json module.zip --clobber

  publish-to-foundry:
    runs-on: ubuntu-latest
    needs: [build]
    if: ${{ always() && (((github.event_name == 'release' && github.event.release.prerelease != true) && needs.build.result == 'success') || github.event_name == 'workflow_dispatch') }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check The Release Exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
        run: |
          gh release view "$TAG" --repo "${{ github.repository }}" --json assets --jq '.assets[].name' | grep -qx module.json \
            || { echo "::error::Release $TAG has no module.json asset; publish it on GitHub first."; exit 1; }

      # Foundry revokes the API key when a package publishes too often: at most one release per 24 hours.
      - name: Allow One Foundry Release Per 24 Hours
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
        run: |
          since=$(date -u -d '24 hours ago' +%s)
          gh api "repos/${{ github.repository }}/actions/workflows/main.yml/runs?per_page=100" \
            --jq '.workflow_runs[] | select(.id != ${{ github.run_id }}) | "\(.id) \(.created_at)"' |
          while read -r id created; do
            [ "$(date -u -d "$created" +%s)" -lt "$since" ] && continue
            published=$(gh api "repos/${{ github.repository }}/actions/runs/$id/jobs" \
              --jq '[.jobs[] | select(.name == "publish-to-foundry" and .conclusion == "success")] | length')
            if [ "$published" -gt 0 ]; then
              echo "::error::Foundry already received a release from run $id at $created (within 24 hours). $TAG stays on GitHub only; its update link works. Publish it later with Run workflow (Publish to Foundry)."
              exit 1
            fi
          done

      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Publish to Foundry VTT
        env:
          FVTT_API_TOKEN: ${{ secrets.FVTT_API_TOKEN }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ -z "$FVTT_API_TOKEN" ]; then
            echo "Foundry publishing skipped: FVTT_API_TOKEN is not configured."
            exit 0
          fi
          jq --arg version "${RELEASE_TAG#v}" \
            --arg manifest "https://github.com/$REPOSITORY/releases/download/$RELEASE_TAG/module.json" \
            --arg notes "https://github.com/$REPOSITORY/releases/tag/$RELEASE_TAG" \
            '{id: .id, "dry-run": ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}, release: {version: $version, manifest: $manifest, notes: $notes, compatibility: .compatibility}}' \
            module.json > foundry-release.json
          curl --fail-with-body --silent --show-error \
            -X POST https://foundryvtt.com/_api/packages/release_version/ \
            -H "Content-Type: application/json" \
            -H "Authorization: $FVTT_API_TOKEN" \
            --data-binary @foundry-release.json
